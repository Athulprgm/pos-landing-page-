<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <defs>
    <!-- Background Frame Gradient -->
    <linearGradient id="logoCardBg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1F1F23"/>
      <stop offset="50%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>

    <!-- Top Facet Gradient (Luminous Titanium) -->
    <linearGradient id="topFacetGrad" x1="20" y1="8" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D4D4D8"/>
    </linearGradient>

    <!-- Left Facet Gradient (Sleek Shadow) -->
    <linearGradient id="leftFacetGrad" x1="9" y1="14" x2="20" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A1A1AA"/>
      <stop offset="100%" stop-color="#52525B"/>
    </linearGradient>

    <!-- Right Facet Gradient (Reflective Gloss) -->
    <linearGradient id="rightFacetGrad" x1="31" y1="14" x2="20" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E4E4E7"/>
      <stop offset="100%" stop-color="#71717A"/>
    </linearGradient>

    <!-- Center Core Glow -->
    <radialGradient id="coreGlow" cx="20" cy="20" r="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Container Surface with subtle micro-border -->
  <rect x="1" y="1" width="38" height="38" rx="10" fill="url(#logoCardBg)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.2"/>
  <rect x="2" y="2" width="36" height="18" rx="9" fill="url(#coreGlow)"/>

  <!-- Geometric Luxury Prism Mark (Isometric Intersecting Apex / Modern Retail Node) -->
  <!-- Top Rhombus Facet -->
  <path d="M20 9L29 14.2L20 19.4L11 14.2L20 9Z" fill="url(#topFacetGrad)"/>
  
  <!-- Left Isometric Facet -->
  <path d="M11 14.2L20 19.4V31L11 25.8V14.2Z" fill="url(#leftFacetGrad)"/>
  
  <!-- Right Isometric Facet -->
  <path d="M20 19.4L29 14.2V25.8L20 31V19.4Z" fill="url(#rightFacetGrad)"/>

  <!-- Precision Inner Light Seams -->
  <path d="M20 9V19.4M20 19.4L11 14.2M20 19.4L29 14.2M20 19.4V31" stroke="#09090B" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Luminous Quantum Vertex Point -->
  <circle cx="20" cy="19.4" r="1.8" fill="#FFFFFF"/>
</svg>
